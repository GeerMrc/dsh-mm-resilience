name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC)
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test # includes pretest tsc gate
      - run: mkdir -p dist-artifacts && npm pack --pack-destination dist-artifacts
      - name: GitHub Release with tarball
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist-artifacts/*.tgz || gh release upload "$GITHUB_REF_NAME" dist-artifacts/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # Node 22 image bundles npm 10.x; OIDC needs >= 11.5.1
      - run: npm install -g npm@11
      - run: npm publish ./dist-artifacts/dsh-mm-resilience-*.tgz --registry https://registry.npmjs.org --access public
